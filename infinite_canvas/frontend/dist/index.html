  <!-- 生成类节点 / 素材文本节点不接受媒体导入（拖入 + 点击上传都拦） -->

  <!-- 画布内 Ctrl+V 粘贴 / 拖入图片 / 视频 / 音频 / 文字 / txt / md，直接建素材节点 -->
  <script defer src="/infinite_canvas/app/assets/xcat-paste.js?v=20261113k"></script>

  <!-- 画布「LoRA 栈」节点（role=lora）：多行选模型 + 强度，连到生成节点后由后端
       把整条链插到该工作流 MODEL 源头（UNet / Checkpoint 加载器）之后 -->
  <script defer src="/infinite_canvas/app/assets/xcat-lora.js?v=20261114e"></script>
</head>
<body>
  <!-- 连线描边滤镜：复刻 ComfyUI litegraph 的 render_connections_border
       （先画 connections_width + 4 的 rgba(0,0,0,0.5) 外描边，再画 3px 本色线）。
       SVG 一条 stroke 只能一层颜色，这里用 feMorphology dilate 把描边扩 2px
       （3 + 2×2 = 7px，与 ComfyUI 完全同宽），再与原图合并。 -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
    <defs>
      <filter id="xcat-link-halo" x="-50%" y="-50%" width="200%" height="200%"
              filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="grow" />
        <feFlood flood-color="#000000" flood-opacity="0.5" result="ink" />
        <feComposite in="ink" in2="grow" operator="in" result="halo" />
        <feMerge>
          <feMergeNode in="halo" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>
  <div id="app"></div>
</body>
